<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>遗物标记 · 水下考古潜水记录</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="topbar">
    <div><h1>水下考古潜水记录</h1><div class="muted">点击沉船平面图添加标记，筛选、编辑并导出JSON；馆藏号、保存等级与交接签字用于借展排期。</div></div>
    <nav id="nav"></nav>
    <button id="exportBtn">导出JSON</button>
  </header>
  <main class="app">
    <section class="panel">
      <div class="map" id="map"><div class="wreck"></div></div>
    </section>
    <aside class="panel">
      <div class="toolbar">
        <select id="filter"><option value="">全部类型</option><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
        <select id="view"><option value="list">标记列表</option><option value="timeline">潜次时间线</option></select>
      </div>
      <form id="form">
        <h2>标记信息</h2>
        <input name="id" type="hidden">
        <label>编号</label><input name="code" required>
        <label>馆藏号</label><input name="accession" placeholder="例如SW-2026-0017">
        <label>类型</label><select name="type"><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
        <label>保存等级</label><select name="grade"></select>
        <label>潜次</label><input name="dive" placeholder="例如DIVE-04" required>
        <label>深度</label><input name="depth" placeholder="例如18.4m" required>
        <label>朝向</label><input name="orientation" placeholder="例如东北偏北">
        <label>保存状态</label><input name="condition" placeholder="例如表面附着贝类">
        <label><input type="checkbox" name="signed" style="width:auto"> 交接签字已齐全</label>
        <label>备注</label><textarea name="note"></textarea>
        <div class="toolbar"><button>保存标记</button><button type="button" id="deleteBtn" class="secondary">删除</button></div>
      </form>
      <h2 id="listTitle">标记列表</h2>
      <div id="list" class="list"></div>
    </aside>
  </main>
  <script src="js/rules.js"></script>
  <script src="js/store.js"></script>
  <script src="js/nav.js"></script>
  <script>
    const map = document.querySelector("#map");
    const form = document.querySelector("#form");
    const list = document.querySelector("#list");
    const filter = document.querySelector("#filter");
    const view = document.querySelector("#view");
    const listTitle = document.querySelector("#listTitle");
    const typeNames = { ceramic: "陶片", wood: "木构件", metal: "金属件", unknown: "未知物" };
    STORE.seed();
    let marks = STORE.getMarks();
    let pending = null;

    // 保存等级选项来自借展规则（js/rules.js 唯一出处）
    form.grade.innerHTML = '<option value="">未定级</option>' +
      LOAN_RULES.RELIC_GRADES.map(g => '<option value="' + g.value + '">' + g.label + "</option>").join("");

    for (let i = 0; i < 7; i++) {
      const rib = document.createElement("div");
      rib.className = "rib";
      rib.style.left = 28 + i * 7 + "%";
      map.appendChild(rib);
    }
    function save() { STORE.saveMarks(marks); }
    function gradePill(m) {
      if (!m.grade) return '<span class="pill warn">未定级</span>';
      const cls = m.grade === "unstable" ? "bad" : m.grade === "fragile" ? "warn" : "ok";
      return '<span class="pill ' + cls + '">' + LOAN_RULES.gradeLabel(m.grade) + "</span>";
    }
    function render() {
      map.querySelectorAll(".marker").forEach(el => el.remove());
      const filtered = filter.value ? marks.filter(m => m.type === filter.value) : marks;
      filtered.forEach(mark => {
        const el = document.createElement("button");
        el.className = "marker " + mark.type + (mark.id === form.id.value ? " selected" : "");
        el.style.left = mark.x + "%";
        el.style.top = mark.y + "%";
        el.textContent = mark.code.slice(0, 2);
        el.onclick = event => { event.stopPropagation(); edit(mark.id); };
        map.appendChild(el);
      });
      if (view.value === "timeline") renderTimeline(filtered);
      else renderList(filtered);
    }
    function renderList(data) {
      listTitle.textContent = "标记列表";
      list.className = "list";
      list.innerHTML = data.map(m => '<div class="item '+(m.id===form.id.value?'active':'')+'" data-id="'+m.id+'"><b>'+m.code+'</b> <span class="pill">'+typeNames[m.type]+'</span>'+gradePill(m)+(m.signed?'<span class="pill ok">已签字</span>':'<span class="pill bad">未签字</span>')+'<div class="muted">'+(m.accession||'无馆藏号')+' · '+m.dive+' · '+m.depth+' · '+m.orientation+'</div><div>'+m.condition+'</div></div>').join("");
      list.querySelectorAll("[data-id]").forEach(el => el.onclick = () => edit(el.dataset.id));
    }
    function renderTimeline(data) {
      listTitle.textContent = "潜次时间线";
      list.className = "timeline";
      const groups = data.reduce((map, item) => ((map[item.dive] ||= []).push(item), map), {});
      list.innerHTML = Object.entries(groups).map(([dive, items]) => '<div class="item"><b>'+dive+'</b><div class="muted">新增'+items.length+'个标记</div>'+items.map(i => '<div>'+i.code+' · '+typeNames[i.type]+'</div>').join("")+'</div>').join("");
    }
    function edit(id) {
      const mark = marks.find(m => m.id === id);
      if (!mark) return;
      for (const [key, value] of Object.entries(mark)) {
        if (!form[key]) continue;
        if (form[key].type === "checkbox") form[key].checked = !!value;
        else form[key].value = value;
      }
      pending = { x: mark.x, y: mark.y };
      render();
    }
    map.addEventListener("click", event => {
      const rect = map.getBoundingClientRect();
      pending = { x: Number(((event.clientX - rect.left) / rect.width * 100).toFixed(2)), y: Number(((event.clientY - rect.top) / rect.height * 100).toFixed(2)) };
      form.reset();
      form.id.value = "";
      form.code.value = "M-" + String(marks.length + 1).padStart(3, "0");
      form.dive.value = "DIVE-01";
      render();
    });
    form.onsubmit = event => {
      event.preventDefault();
      if (!pending) pending = { x: 50, y: 50 };
      const data = Object.fromEntries(new FormData(form).entries());
      data.signed = form.signed.checked;
      if (data.id) Object.assign(marks.find(m => m.id === data.id), data, pending);
      else marks.push({ ...data, id: crypto.randomUUID(), ...pending });
      save(); render();
    };
    document.querySelector("#deleteBtn").onclick = () => {
      if (!form.id.value) return;
      marks = marks.filter(m => m.id !== form.id.value);
      form.reset(); pending = null; save(); render();
    };
    document.querySelector("#exportBtn").onclick = () => {
      const blob = new Blob([JSON.stringify(marks, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "dive-marks.json"; a.click(); URL.revokeObjectURL(a.href);
    };
    filter.onchange = render; view.onchange = render;
    render();
  </script>
</body>
</html>
